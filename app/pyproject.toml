[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fad-downloader"
version = "0.1.0"
description = "Raccolta locale dei materiali Moodle con interfaccia Tkinter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.4,<3", "beautifulsoup4>=4.12,<5", "keyring>=25,<26", "nh3>=0.3,<0.4", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11", "build>=1", "pip-audit>=2.7", "bandit>=1.8"]

[project.scripts]
fad-downloader = "fad_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gui: richiede un display Tk", "live: richiede accesso Moodle reale"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
